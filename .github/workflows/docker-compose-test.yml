name: Docker Compose Test Workflow

on:
  workflow_dispatch:
  push:
    branches: [ haritest ]
    paths:
      - '.github/workflows/docker-compose-test.yml'

jobs:
  test-docker-compose:
    name: Test Docker Compose Installation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Debug environment
        run: |
          echo "GitHub runner environment info:"
          uname -a
          echo "Docker version:"
          docker --version || echo "Docker not available"
          
          echo "Docker Compose status - before installation:"
          docker compose version || echo "Docker Compose V2 not available"
          docker-compose --version || echo "Legacy Docker Compose not available"
          
          echo "Content of docker directory:"
          ls -la docker/ || echo "Docker directory not found"
          
          echo "Checking for docker-compose.yml:"
          if [ -f "docker-compose.yml" ]; then
            echo "docker-compose.yml exists:"
            cat docker-compose.yml
          else
            echo "docker-compose.yml not found"
          fi
      
      - name: Setup Docker Compose V1
        run: |
          echo "Installing Docker Compose V1..."
          DOCKER_COMPOSE_VERSION=1.29.2
          
          # Download Docker Compose binary
          sudo curl -L "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          
          # Apply executable permissions
          sudo chmod +x /usr/local/bin/docker-compose
          
          # Verify installation
          docker-compose --version

      - name: Setup Docker Compose V2
        run: |
          echo "Setting up Docker Compose V2..."
          
          # Create Docker CLI plugins directory
          mkdir -p $HOME/.docker/cli-plugins
          
          # Download Docker Compose binary
          curl -SL "https://github.com/docker/compose/releases/download/v2.19.1/docker-compose-$(uname -s)-$(uname -m)" -o $HOME/.docker/cli-plugins/docker-compose
          
          # Apply executable permissions
          chmod +x $HOME/.docker/cli-plugins/docker-compose
          
          # Verify installation
          docker compose version
      
      - name: Verify Docker Compose Installation
        run: |
          echo "Verifying Docker Compose installations:"
          
          # Verify Docker Compose V1
          which docker-compose || echo "docker-compose command not found"
          docker-compose --version || echo "docker-compose failed to execute"
          
          # Verify Docker Compose V2
          docker compose version || echo "docker compose plugin failed to execute"
          
          # Check paths
          echo "PATH: $PATH"
          echo "Docker CLI plugins:"
          ls -la $HOME/.docker/cli-plugins/ || echo "CLI plugins directory not found"
          
          echo "Location of docker-compose binary:"
          which docker-compose || echo "docker-compose not in PATH"
          
          echo "Docker info:"
          docker info || echo "Failed to get Docker info"
      
      - name: Test Docker Compose with simple services
        run: |
          # Pull test image first
          docker pull alpine:latest
          
          # Create a simple test docker-compose file with a service that will stay running
          cat > docker-compose-test.yml << EOF
          version: "2"
          
          services:
            alpine-test:
              image: alpine:latest
              container_name: alpine-test
              command: ["sh", "-c", "echo 'Alpine container is running' && sleep 5"]
          EOF
          
          echo "Testing Docker Compose configuration parsing..."
          # Test config parsing with Docker Compose V2
          echo "Docker Compose V2 config:"
          docker compose -f docker-compose-test.yml config
          
          # Test config parsing with Docker Compose V1
          echo "Docker Compose V1 config:"
          docker-compose -f docker-compose-test.yml config
          
          echo "Running Docker Compose services..."
          # Run with Docker Compose V2
          echo "Running with Docker Compose V2:"
          docker compose -f docker-compose-test.yml up --no-build --force-recreate -d
          sleep 10
          docker compose -f docker-compose-test.yml logs
          docker compose -f docker-compose-test.yml down
          
          # Run with Docker Compose V1
          echo "Running with Docker Compose V1:"
          docker-compose -f docker-compose-test.yml up --no-build --force-recreate -d
          sleep 10
          docker-compose -f docker-compose-test.yml logs
          docker-compose -f docker-compose-test.yml down
      
      - name: Test with BioGears Compose File
        run: |
          echo "Testing Docker Compose with BioGears files..."
          
          # Always use a test compose file to avoid modifying the original
          echo "Creating a simplified test compose file for BioGears..."
          cat > docker-compose-biogears-test.yml << EOF
          version: "2"
          
          services:
            biogears-external:
              image: alpine:latest
              container_name: biogears-external-test
              command: ["sh", "-c", "echo 'BioGears external test' && sleep 5"]
              
            biogears-builder:
              image: alpine:latest
              container_name: biogears-builder-test
              command: ["sh", "-c", "echo 'BioGears builder test' && sleep 5"]
          EOF
          
          # Test the created file with Docker Compose V2
          echo "Testing with Docker Compose V2..."
          echo "Compose file content:"
          cat docker-compose-biogears-test.yml
          
          echo "Validating config:"
          docker compose -f docker-compose-biogears-test.yml config || echo "Failed to validate config with Docker Compose V2"
          
          echo "Testing Docker Compose V2 up/down:"
          docker compose -f docker-compose-biogears-test.yml up -d || echo "Failed to start containers with Docker Compose V2"
          sleep 5
          docker compose -f docker-compose-biogears-test.yml logs || echo "Failed to get logs with Docker Compose V2"
          docker compose -f docker-compose-biogears-test.yml down || echo "Failed to stop containers with Docker Compose V2"
          
          # Test with Docker Compose V1
          echo "Testing with Docker Compose V1..."
          docker-compose -f docker-compose-biogears-test.yml config || echo "Failed to validate config with Docker Compose V1"
          docker-compose -f docker-compose-biogears-test.yml up -d || echo "Failed to start containers with Docker Compose V1"
          sleep 5
          docker-compose -f docker-compose-biogears-test.yml logs || echo "Failed to get logs with Docker Compose V1"
          docker-compose -f docker-compose-biogears-test.yml down || echo "Failed to stop containers with Docker Compose V1"
          
          # If the original docker-compose.yml exists, just check its syntax without modifying it
          if [ -f "docker-compose.yml" ]; then
            echo "Testing original docker-compose.yml config (without modification):"
            echo "Content:"
            cat docker-compose.yml
            
            echo "Validating with Docker Compose V2:"
            docker compose -f docker-compose.yml config --services || echo "Failed to validate original file with Docker Compose V2"
            
            echo "Validating with Docker Compose V1:"
            docker-compose -f docker-compose.yml config --services || echo "Failed to validate original file with Docker Compose V1"
          fi
      
      - name: Build External Image (if possible)
        run: |
          if [ -d "docker/external" ] && [ -f "docker/external/Dockerfile" ]; then
            echo "Inspecting Dockerfile content:"
            cat docker/external/Dockerfile
            
            echo "Building external image with Docker..."
            # Use --progress=plain for better debugging output
            docker build -t biogears-external-test --progress=plain docker/external || echo "Failed to build with Docker"
          else
            echo "External Dockerfile not found, skipping build test"
          fi
      
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up test containers..."
          docker rm -f alpine-test || true
          docker rm -f biogears-external-test || true
          docker rm -f biogears-builder-test || true
          docker rmi biogears-external-test || true
          
          echo "Test completed" 