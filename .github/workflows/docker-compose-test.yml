name: Docker Compose Test Workflow

on:
  workflow_dispatch:
  push:
    branches: [ haritest ]
    paths:
      - '.github/workflows/docker-compose-test.yml'

jobs:
  test-docker-compose:
    name: Test Docker Compose Installation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Debug environment
        run: |
          echo "GitHub runner environment info:"
          uname -a
          echo "Docker version:"
          docker --version || echo "Docker not available"
          
          echo "Docker Compose status:"
          docker compose version || echo "Docker Compose V2 not available"
          docker-compose --version || echo "Legacy Docker Compose not available"
          
          echo "Content of docker directory:"
          ls -la docker/
          
          echo "Checking for docker-compose.yml:"
          if [ -f "docker-compose.yml" ]; then
            echo "docker-compose.yml exists:"
            cat docker-compose.yml
          else
            echo "docker-compose.yml not found"
          fi
      
      - name: Setup Docker Compose
        run: |
          echo "Setting up Docker Compose..."
          
          # Check if Docker Compose V2 plugin is available
          if ! docker compose version &>/dev/null; then
            echo "Docker Compose V2 plugin not available, setting up..."
            DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
            mkdir -p $DOCKER_CONFIG/cli-plugins
            COMPOSE_VERSION="v2.19.1"
            echo "Installing Docker Compose version: $COMPOSE_VERSION"
            curl -sL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o $DOCKER_CONFIG/cli-plugins/docker-compose
            chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
            docker compose version
          else
            echo "Docker Compose V2 plugin already available:"
            docker compose version
          fi
          
          # Also install standalone Docker Compose V1 for compatibility
          if ! command -v docker-compose &>/dev/null; then
            echo "Docker Compose V1 not found, installing..."
            sudo curl -SL "https://github.com/docker/compose/releases/download/v1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            docker-compose --version
          else
            echo "Docker Compose V1 already available:"
            docker-compose --version
          fi
          
          # Verify correct installation
          echo "Final Docker Compose status:"
          which docker-compose
          docker-compose --version
          docker compose version
      
      - name: Test Docker Compose with test file
        run: |
          # Create a simple test docker-compose file
          cat > docker-compose-test.yml << EOF
          version: "2"
          
          services:
            hello-world:
              image: hello-world
              container_name: test-hello-world
          EOF
          
          # Try using Docker Compose V2 first
          echo "Testing with Docker Compose V2..."
          if docker compose -f docker-compose-test.yml up; then
            echo "Docker Compose V2 test successful"
          else
            echo "Docker Compose V2 test failed, trying V1..."
            # Try with V1 as fallback
            docker-compose -f docker-compose-test.yml up
          fi
      
      - name: Test with actual BioGears docker-compose file
        run: |
          if [ -f "docker-compose.yml" ]; then
            echo "Testing with actual BioGears docker-compose.yml..."
            
            # Modify to use publicly available images for testing
            sed -i 's|image: biogears-external|image: ubuntu:18.04|g' docker-compose.yml
            
            # Test Docker Compose V2 parsing
            docker compose config || echo "Docker Compose V2 config check failed"
            
            # Try listing services
            echo "Available services:"
            docker compose config --services || docker-compose config --services
            
            # Try to build the external image only (safer test)
            if [ -d "docker/external" ] && [ -f "docker/external/Dockerfile" ]; then
              echo "Building external image with Docker Compose..."
              docker compose build biogears-external || docker-compose build biogears-external
            fi
          else
            echo "No docker-compose.yml found to test"
            # Create a test one based on what we know
            cat > docker-compose-biogears.yml << EOF
            version: "2"
            
            services:
              biogears-external:
                build:
                  context: ./docker/external
                  dockerfile: Dockerfile
                image: biogears-external
            EOF
            
            # Test the created file
            echo "Testing with created docker-compose-biogears.yml"
            docker compose -f docker-compose-biogears.yml config || docker-compose -f docker-compose-biogears.yml config
            docker compose -f docker-compose-biogears.yml build biogears-external || docker-compose -f docker-compose-biogears.yml build biogears-external
          fi
      
      - name: Cleanup
        run: |
          echo "Cleaning up test containers..."
          docker rm -f test-hello-world || true
          
          echo "Test completed successfully" 