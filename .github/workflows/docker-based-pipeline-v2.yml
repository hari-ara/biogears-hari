name: BioGears Docker-based Pipeline V2

on:
  push:
    branches: [ haritest ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build-pipeline:
    name: Docker Build and Security Pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Debug environment
        run: |
          echo "GitHub runner environment info:"
          uname -a
          echo "Docker version:"
          docker --version || echo "Docker not available"
          
          echo "Docker Compose status - before installation:"
          docker compose version || echo "Docker Compose V2 not available"
          docker-compose --version || echo "Legacy Docker Compose not available"
          
          echo "Content of docker directory:"
          ls -la docker/ || echo "Docker directory not found"
          
          echo "Checking for docker-compose.yml:"
          if [ -f "docker-compose.yml" ]; then
            echo "docker-compose.yml exists:"
            cat docker-compose.yml
          else
            echo "docker-compose.yml not found"
          fi
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Inspect Docker directory
        run: |
          echo "Examining Docker directory structure..."
          ls -la docker/
          
          # Examine Dockerfiles
          for df in $(find docker -name "Dockerfile"); do
            echo "Contents of $df:"
            cat $df
            echo "--------------------"
          done
      
      - name: Setup Docker Compose V1
        run: |
          echo "Installing Docker Compose V1..."
          DOCKER_COMPOSE_VERSION=1.29.2
          
          # Download Docker Compose binary
          sudo curl -L "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          
          # Apply executable permissions
          sudo chmod +x /usr/local/bin/docker-compose
          
          # Verify installation
          docker-compose --version

      - name: Setup Docker Compose V2
        run: |
          echo "Setting up Docker Compose V2..."
          
          # Create Docker CLI plugins directory
          mkdir -p $HOME/.docker/cli-plugins
          
          # Download Docker Compose binary
          curl -SL "https://github.com/docker/compose/releases/download/v2.19.1/docker-compose-$(uname -s)-$(uname -m)" -o $HOME/.docker/cli-plugins/docker-compose
          
          # Apply executable permissions
          chmod +x $HOME/.docker/cli-plugins/docker-compose
          
          # Verify installation
          docker compose version
      
      - name: Verify Docker Compose Installation
        run: |
          echo "Verifying Docker Compose installations:"
          
          # Verify Docker Compose V1
          which docker-compose || echo "docker-compose command not found"
          docker-compose --version || echo "docker-compose failed to execute"
          
          # Verify Docker Compose V2
          docker compose version || echo "docker compose plugin failed to execute"
          
          # Check paths
          echo "PATH: $PATH"
          echo "Docker CLI plugins:"
          ls -la $HOME/.docker/cli-plugins/ || echo "CLI plugins directory not found"
          
          echo "Location of docker-compose binary:"
          which docker-compose || echo "docker-compose not in PATH"
      
      - name: Build External Base Image
        run: |
          # Build the external dependencies image first
          echo "Building biogears-external image..."
          
          docker build -t ghcr.io/${{ github.repository_owner }}/biogears-external:latest --progress=plain -f docker/external/Dockerfile docker/external
          
          # Tag with date-based version
          SHORT_SHA="${{ github.sha }}"
          DATE_VERSION="$(date +%Y%m%d)-${SHORT_SHA:0:8}"
          docker tag ghcr.io/${{ github.repository_owner }}/biogears-external:latest ghcr.io/${{ github.repository_owner }}/biogears-external:${DATE_VERSION}
          
          # Push to GitHub Container Registry
          docker push ghcr.io/${{ github.repository_owner }}/biogears-external:latest
          docker push ghcr.io/${{ github.repository_owner }}/biogears-external:${DATE_VERSION}
          
          # Get image digest
          EXTERNAL_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository_owner }}/biogears-external:latest | cut -d'@' -f2 || docker images --no-trunc --quiet ghcr.io/${{ github.repository_owner }}/biogears-external:latest)
          echo "EXTERNAL_DIGEST=$EXTERNAL_DIGEST" > image-digests.txt
          echo "EXTERNAL_VERSION=$DATE_VERSION" >> image-digests.txt
          echo "External image digest: $EXTERNAL_DIGEST"
      
      - name: Prepare BioGears build with Docker Compose
        run: |
          if [ -f "docker-compose.yml" ]; then
            # Create a modified docker-compose.yml for GitHub Container Registry
            echo "Creating modified docker-compose file for GitHub Container Registry..."
            
            # First get the values from the original
            cp docker-compose.yml docker-compose.original.yml
            
            # Create a new file to avoid modifying the original
            cat > docker-compose.ghcr.yml << EOF
          version: "2"

          services:
            biogears-external:
              image: ghcr.io/${{ github.repository_owner }}/biogears-external:latest
            
            biogears-builder:
              image: ghcr.io/${{ github.repository_owner }}/biogears-builder:latest
              working_dir: /opt/biogears/core/build
              volumes:
                - ./:/opt/biogears/core
                - ../validation:/opt/biogears/validation
              tty: true
          EOF
          
            echo "Created docker-compose.ghcr.yml:"
            cat docker-compose.ghcr.yml
          else
            echo "No docker-compose.yml found. Will create a simple one for building..."
            
            # Create a simple compose file for building
            cat > docker-compose.ghcr.yml << EOF
          version: "2"

          services:
            biogears-external:
              image: ghcr.io/${{ github.repository_owner }}/biogears-external:latest
            
            biogears-builder:
              build:
                context: ./docker/release
                args:
                  EXTERNAL_IMAGE: ghcr.io/${{ github.repository_owner }}/biogears-external:latest
              image: ghcr.io/${{ github.repository_owner }}/biogears-builder:latest
          EOF
            
            echo "Created docker-compose.ghcr.yml:"
            cat docker-compose.ghcr.yml
          fi
      
      - name: Build BioGears with Docker
        run: |
          SHORT_SHA="${{ github.sha }}"
          DATE_VERSION="$(date +%Y%m%d)-${SHORT_SHA:0:8}"
          
          # Try using Docker Compose first if the file exists
          if [ -f "docker-compose.ghcr.yml" ]; then
            echo "Building with Docker Compose..."
            
            # Try with Docker Compose V2 first
            if docker compose version &>/dev/null; then
              echo "Using Docker Compose V2..."
              # Check configuration
              docker compose -f docker-compose.ghcr.yml config
              
              # Check if biogears-builder service has a build section
              if docker compose -f docker-compose.ghcr.yml config | grep -q "build:"; then
                # Build using Docker Compose
                echo "Building builder image with Docker Compose V2..."
                docker compose -f docker-compose.ghcr.yml build biogears-builder
                
                # Tag with date-based version
                docker tag ghcr.io/${{ github.repository_owner }}/biogears-builder:latest ghcr.io/${{ github.repository_owner }}/biogears-builder:${DATE_VERSION}
                
                # Push to GitHub Container Registry
                docker push ghcr.io/${{ github.repository_owner }}/biogears-builder:latest
                docker push ghcr.io/${{ github.repository_owner }}/biogears-builder:${DATE_VERSION}
              else
                echo "No build section found in docker-compose.ghcr.yml, using direct Docker build..."
                # Build directly with Docker
                if [ -f "docker/release/Dockerfile" ]; then
                  echo "Building with docker/release/Dockerfile..."
                  docker build -t ghcr.io/${{ github.repository_owner }}/biogears-builder:latest \
                    --build-arg EXTERNAL_IMAGE=ghcr.io/${{ github.repository_owner }}/biogears-external:latest \
                    --progress=plain \
                    -f docker/release/Dockerfile .
                elif [ -f "docker/builder/Dockerfile" ]; then
                  echo "Building with docker/builder/Dockerfile..."
                  docker build -t ghcr.io/${{ github.repository_owner }}/biogears-builder:latest \
                    --build-arg EXTERNAL_IMAGE=ghcr.io/${{ github.repository_owner }}/biogears-external:latest \
                    --progress=plain \
                    -f docker/builder/Dockerfile .
                else
                  # Try to find any other suitable Dockerfile
                  for df in $(find docker -name "Dockerfile" | grep -v external); do
                    echo "Found Dockerfile: $df"
                    docker build -t ghcr.io/${{ github.repository_owner }}/biogears-builder:latest \
                      --build-arg EXTERNAL_IMAGE=ghcr.io/${{ github.repository_owner }}/biogears-external:latest \
                      --progress=plain \
                      -f $df .
                    break
                  done
                fi
                
                # Tag with date-based version
                docker tag ghcr.io/${{ github.repository_owner }}/biogears-builder:latest ghcr.io/${{ github.repository_owner }}/biogears-builder:${DATE_VERSION}
                
                # Push to GitHub Container Registry
                docker push ghcr.io/${{ github.repository_owner }}/biogears-builder:latest
                docker push ghcr.io/${{ github.repository_owner }}/biogears-builder:${DATE_VERSION}
              fi
            else
              echo "Docker Compose V2 not available, falling back to V1..."
              # Check configuration
              docker-compose -f docker-compose.ghcr.yml config
              
              # Build using Docker Compose V1
              docker-compose -f docker-compose.ghcr.yml build biogears-builder
              
              # Tag with date-based version
              docker tag ghcr.io/${{ github.repository_owner }}/biogears-builder:latest ghcr.io/${{ github.repository_owner }}/biogears-builder:${DATE_VERSION}
              
              # Push to GitHub Container Registry
              docker push ghcr.io/${{ github.repository_owner }}/biogears-builder:latest
              docker push ghcr.io/${{ github.repository_owner }}/biogears-builder:${DATE_VERSION}
            fi
          else
            echo "No docker-compose file created, building directly with Docker..."
            
            if [ -f "docker/release/Dockerfile" ]; then
              echo "Building with docker/release/Dockerfile..."
              docker build -t ghcr.io/${{ github.repository_owner }}/biogears-builder:latest \
                --build-arg EXTERNAL_IMAGE=ghcr.io/${{ github.repository_owner }}/biogears-external:latest \
                --progress=plain \
                -f docker/release/Dockerfile .
            elif [ -f "docker/builder/Dockerfile" ]; then
              echo "Building with docker/builder/Dockerfile..."
              docker build -t ghcr.io/${{ github.repository_owner }}/biogears-builder:latest \
                --build-arg EXTERNAL_IMAGE=ghcr.io/${{ github.repository_owner }}/biogears-external:latest \
                --progress=plain \
                -f docker/builder/Dockerfile .
            else
              echo "No suitable Dockerfile found for builder."
              exit 1
            fi
            
            # Tag with date-based version
            docker tag ghcr.io/${{ github.repository_owner }}/biogears-builder:latest ghcr.io/${{ github.repository_owner }}/biogears-builder:${DATE_VERSION}
            
            # Push to GitHub Container Registry
            docker push ghcr.io/${{ github.repository_owner }}/biogears-builder:latest
            docker push ghcr.io/${{ github.repository_owner }}/biogears-builder:${DATE_VERSION}
          fi
          
          # Get image digest
          BUILDER_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository_owner }}/biogears-builder:latest | cut -d'@' -f2 || docker images --no-trunc --quiet ghcr.io/${{ github.repository_owner }}/biogears-builder:latest)
          echo "BUILDER_DIGEST=$BUILDER_DIGEST" >> image-digests.txt
          echo "BUILDER_VERSION=$DATE_VERSION" >> image-digests.txt
          echo "Builder image digest: $BUILDER_DIGEST"
      
      - name: Install security tools
        run: |
          # Install Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.41.0
          trivy --version
          
          # Install OPA
          curl -L -o opa https://github.com/open-policy-agent/opa/releases/latest/download/opa_linux_amd64
          chmod 755 opa
          sudo mv opa /usr/local/bin/opa
          opa version
          
          # Install Cosign
          curl -L -o cosign https://github.com/sigstore/cosign/releases/download/v2.1.1/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/cosign
          cosign version
          
          # Install ORAS
          curl -LO https://github.com/oras-project/oras/releases/download/v1.1.0/oras_1.1.0_linux_amd64.tar.gz
          mkdir -p oras-install/
          tar -zxf oras_1.1.0_linux_amd64.tar.gz -C oras-install/
          sudo mv oras-install/oras /usr/local/bin/
          oras version
      
      - name: Generate SBOMs and scan for vulnerabilities
        run: |
          # Source the image digests and versions
          source image-digests.txt
          
          # Debug image digests
          echo "Image digests from file:"
          cat image-digests.txt
          
          # Generate SBOM for external image
          echo "Generating SBOM for external image..."
          trivy image --format cyclonedx --output sbom-external.cyclonedx.json ghcr.io/${{ github.repository_owner }}/biogears-external:latest
          
          # Generate SBOM for builder image  
          echo "Generating SBOM for builder image..."
          trivy image --format cyclonedx --output sbom-builder.cyclonedx.json ghcr.io/${{ github.repository_owner }}/biogears-builder:latest
          
          # Generate scan results for policy evaluation
          echo "Generating vulnerability scan reports..."
          trivy image --format json --output trivy-external.json ghcr.io/${{ github.repository_owner }}/biogears-external:latest
          trivy image --format json --output trivy-builder.json ghcr.io/${{ github.repository_owner }}/biogears-builder:latest
          
          # Generate HTML reports for better visualization
          trivy image --format template --template "@/usr/local/lib/trivy/templates/html.tpl" --output trivy-external.html ghcr.io/${{ github.repository_owner }}/biogears-external:latest || echo "HTML report generation failed"
          trivy image --format template --template "@/usr/local/lib/trivy/templates/html.tpl" --output trivy-builder.html ghcr.io/${{ github.repository_owner }}/biogears-builder:latest || echo "HTML report generation failed"
      
      - name: Create and sign policies
        run: |
          mkdir -p policies/rego
          
          # Create SBOM policy
          cat > policies/rego/sbom_policy.rego << 'EOF'
          package sbom

          # SBOM must be in CycloneDX format
          valid_format {
              input.bomFormat == "CycloneDX"
          }

          # SBOM must have a version specified
          has_version {
              input.specVersion != null
              input.specVersion != ""
          }

          # SBOM must have components
          has_components {
              count(input.components) > 0
          }

          # Verify SBOM has metadata
          has_metadata {
              input.metadata != null
          }

          # Check if there are any critical vulnerabilities
          has_critical_vulnerabilities {
              some component, vulnerability
              input.components[component].vulnerabilities[vulnerability].severity == "critical"
          }

          # Deny if there are critical vulnerabilities
          deny[msg] {
              has_critical_vulnerabilities
              msg := "SBOM contains components with critical vulnerabilities"
          }

          # SBOM is valid if it passes all validation checks
          valid {
              valid_format
              has_version
              has_components
              has_metadata
          }

          # Generate an attestation statement
          attestation[result] {
              result := {
                  "valid": valid,
                  "format": input.bomFormat,
                  "components_count": count(input.components),
                  "timestamp": time.now_ns()
              }
          }
          EOF

          # Create container scan policy
          cat > policies/rego/container_scan_policy.rego << 'EOF'
          package container_scan

          # Maximum allowed counts for different vulnerability severities
          max_critical = 0
          max_high = 10
          max_medium = 30

          # Count vulnerabilities by severity
          critical_count = count {
              count = count([v | v = input.Results[_].Vulnerabilities[_]; v.Severity == "CRITICAL"])
          }

          high_count = count {
              count = count([v | v = input.Results[_].Vulnerabilities[_]; v.Severity == "HIGH"])
          }

          medium_count = count {
              count = count([v | v = input.Results[_].Vulnerabilities[_]; v.Severity == "MEDIUM"])
          }

          # Vulnerability policy violations
          violations[msg] {
              critical_count > max_critical
              msg := sprintf("Critical vulnerabilities found: %d (maximum allowed: %d)", [critical_count, max_critical])
          }

          violations[msg] {
              high_count > max_high
              msg := sprintf("High vulnerabilities found: %d (maximum allowed: %d)", [high_count, max_high])
          }

          violations[msg] {
              medium_count > max_medium
              msg := sprintf("Medium vulnerabilities found: %d (maximum allowed: %d)", [medium_count, max_medium])
          }

          # Image scan is compliant if there are no violations
          compliant {
              count(violations) == 0
          }

          # Generate an attestation statement
          attestation[result] {
              result := {
                  "compliant": compliant,
                  "critical_vulnerabilities": critical_count,
                  "high_vulnerabilities": high_count, 
                  "medium_vulnerabilities": medium_count,
                  "timestamp": time.now_ns()
              }
          }
          EOF
          
          # Create build attestation policy
          cat > policies/rego/build_attestation_policy.rego << 'EOF'
          package build_attestation

          # Required build metadata fields
          required_fields = {
              "builder_id",
              "build_type",
              "source_repo",
              "commit_hash",
              "build_timestamp",
              "build_platform"
          }

          # Check if all required fields are present
          has_required_fields {
              field := required_fields[_]
              input[field]
          }

          missing_fields[field] {
              field := required_fields[_]
              not input[field]
          }

          # Verify the build type is allowed
          allowed_build_types = {"Release", "Debug"}

          has_valid_build_type {
              input.build_type == allowed_build_types[_]
          }

          # Verify the build platform is allowed
          allowed_platforms = {"linux", "macos", "windows", "docker"}

          has_valid_platform {
              input.build_platform == allowed_platforms[_]
          }

          # Deny reasons
          deny[msg] {
              count(missing_fields) > 0
              msg := sprintf("Missing required build metadata fields: %v", [missing_fields])
          }

          deny[msg] {
              not has_valid_build_type
              msg := sprintf("Invalid build type: %s. Allowed types: %v", [input.build_type, allowed_build_types])
          }

          deny[msg] {
              not has_valid_platform
              msg := sprintf("Invalid build platform: %s. Allowed platforms: %v", [input.build_platform, allowed_platforms])
          }

          # Build attestation is valid if there are no violations
          valid {
              count(deny) == 0
          }

          # Generate an attestation statement
          attestation[result] {
              result := {
                  "valid": valid,
                  "builder_id": input.builder_id,
                  "build_type": input.build_type,
                  "source_repo": input.source_repo,
                  "commit_hash": input.commit_hash,
                  "build_timestamp": input.build_timestamp,
                  "build_platform": input.build_platform,
                  "timestamp": time.now_ns()
              }
          }
          EOF
          
          # Create in-toto attestation converter
          cat > policies/rego/intoto_attestation.rego << 'EOF'
          package intoto

          # Convert custom attestation to in-toto format
          to_intoto_format(data, subject_name, subject_digest, predicate_type) = intoto_statement {
              intoto_statement := {
                  "_type": "https://in-toto.io/Statement/v0.1",
                  "subject": [{
                      "name": subject_name,
                      "digest": subject_digest
                  }],
                  "predicateType": predicate_type,
                  "predicate": data
              }
          }

          # Generate in-toto build attestation
          build_attestation[statement] {
              # First get regular build attestation data
              attestation := data.build_attestation.attestation[_]
              
              # Convert to in-toto format
              statement := to_intoto_format(
                  attestation,
                  sprintf("build-%s", [attestation.build_platform]),
                  {"sha256": attestation.commit_hash},
                  "https://example.org/attestations/build/v1"
              )
          }

          # Generate in-toto container scan attestation
          container_scan_attestation[statement] {
              # Get container scan attestation data
              scan := data.container_scan.attestation[_]
              
              # Convert to in-toto format
              statement := to_intoto_format(
                  scan,
                  sprintf("container-scan-%s", [input.image_name]),
                  {"sha256": input.image_digest},
                  "https://example.org/attestations/container-scan/v1"
              )
          }

          # Generate in-toto SBOM attestation
          sbom_attestation[statement] {
              # Get SBOM attestation data
              sbom := data.sbom.attestation[_]
              
              # Convert to in-toto format
              statement := to_intoto_format(
                  sbom,
                  sprintf("sbom-%s", [input.image_name]),
                  {"sha256": input.image_digest},
                  "https://in-toto.io/attestation/sbom/v1"
              )
          }
          EOF
          
          # Generate and sign policy files
          cosign generate-key-pair
          
          for policy_file in policies/rego/*.rego; do
            cosign sign-blob --key cosign.key "$policy_file" > "$policy_file.sig" || echo "Failed to sign $policy_file"
          done
          
          tar -czvf signed-policies.tar.gz policies/
      
      - name: Create build metadata
        run: |
          cat > build-metadata.json << EOF
          {
            "builder_id": "github-actions",
            "build_type": "Release",
            "source_repo": "${{ github.server_url }}/${{ github.repository }}",
            "commit_hash": "${{ github.sha }}",
            "build_timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "build_platform": "docker"
          }
          EOF
      
      - name: Generate attestations
        run: |
          source image-digests.txt
          
          # Create image metadata files for in-toto attestations
          cat > external-image-data.json << EOF
          {
            "image_name": "biogears-external",
            "image_digest": "${EXTERNAL_DIGEST}",
            "image_version": "${EXTERNAL_VERSION}"
          }
          EOF
          
          cat > builder-image-data.json << EOF
          {
            "image_name": "biogears-builder",
            "image_digest": "${BUILDER_DIGEST}",
            "image_version": "${BUILDER_VERSION}"
          }
          EOF
          
          # Generate Regular Attestations
          opa eval -i build-metadata.json -d policies/rego/build_attestation_policy.rego "data.build_attestation.attestation" -f json > build-attestation-raw.json || echo "Failed to generate build attestation"
          
          opa eval -i trivy-external.json -d policies/rego/container_scan_policy.rego "data.container_scan.attestation" -f json > container-scan-external-raw.json || echo "Failed to generate external scan attestation"
          opa eval -i trivy-builder.json -d policies/rego/container_scan_policy.rego "data.container_scan.attestation" -f json > container-scan-builder-raw.json || echo "Failed to generate builder scan attestation"
          
          opa eval -i sbom-external.cyclonedx.json -d policies/rego/sbom_policy.rego "data.sbom.attestation" -f json > sbom-external-raw.json || echo "Failed to generate external SBOM attestation"
          opa eval -i sbom-builder.cyclonedx.json -d policies/rego/sbom_policy.rego "data.sbom.attestation" -f json > sbom-builder-raw.json || echo "Failed to generate builder SBOM attestation"
          
          # Sign attestations
          for file in *-raw.json; do
            if [ -f "$file" ]; then
              cosign sign-blob --key cosign.key "$file" > "$file.sig" || echo "Failed to sign $file"
            fi
          done
          
          # Package all signatures
          mkdir -p all-signatures
          cp *.sig all-signatures/ || echo "No signatures to copy"
          tar -czvf all-signatures.tar.gz all-signatures/
      
      - name: Publish artifacts with ORAS
        run: |
          # Source version info
          source image-digests.txt
          
          # Create artifact directories
          mkdir -p artifacts/{sboms,attestations,signatures,policies,reports}
          
          # Copy artifacts to their directories
          cp *.cyclonedx.json artifacts/sboms/ || echo "No SBOM files to copy"
          cp *-raw.json artifacts/attestations/ || echo "No attestation files to copy"
          cp -r all-signatures/* artifacts/signatures/ || echo "No signature files to copy"
          cp -r policies/rego/* artifacts/policies/ || echo "No policy files to copy"
          cp *.html artifacts/reports/ || echo "No HTML reports to copy"
          
          # Create archive files for ORAS
          tar -czf sbom.tar.gz -C artifacts/sboms . || echo "No SBOM artifacts to archive"
          tar -czf attestations.tar.gz -C artifacts/attestations . || echo "No attestation artifacts to archive"
          tar -czf signatures.tar.gz -C artifacts/signatures . || echo "No signature artifacts to archive"
          tar -czf policies.tar.gz -C artifacts/policies . || echo "No policy artifacts to archive"
          tar -czf reports.tar.gz -C artifacts/reports . || echo "No report artifacts to archive"
          
          # Push artifacts to registry with version tags
          REPOSITORY="ghcr.io/${{ github.repository_owner }}/biogears-artifacts"
          
          # Push artifacts if they exist
          for artifact in sbom attestations signatures policies reports; do
            if [ -f "${artifact}.tar.gz" ]; then
              echo "Pushing ${artifact} artifacts..."
              # Push with both latest and versioned tags
              oras push "${REPOSITORY}:${artifact}-${EXTERNAL_VERSION}" "${artifact}.tar.gz:application/tar+gzip" || echo "Failed to push ${artifact} with version tag"
              oras push "${REPOSITORY}:${artifact}-latest" "${artifact}.tar.gz:application/tar+gzip" || echo "Failed to push ${artifact} with latest tag"
            else
              echo "No ${artifact} artifacts to push"
            fi
          done
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: security-artifacts
          path: |
            artifacts/
            *.json
            *.html
            *.sig
      
      - name: Generate summary report
        run: |
          source image-digests.txt
          
          cat > biogears-pipeline-report.md << EOF
          # BioGears Secure CI/CD Pipeline Report
          
          Generated: $(date -u)
          Version: ${EXTERNAL_VERSION}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          ## Docker Images
          
          - External: ghcr.io/${{ github.repository_owner }}/biogears-external:${EXTERNAL_VERSION}
          - Builder: ghcr.io/${{ github.repository_owner }}/biogears-builder:${BUILDER_VERSION}
          
          ## Pipeline Steps Completed
          
          - ✅ Docker Build
          - ✅ SBOM Generation
          - ✅ Vulnerability Scanning
          - ✅ Policy Creation and Signing
          - ✅ Attestation Generation
          - ✅ OCI Registry Publication
          
          ## Artifacts Published to GitHub Container Registry
          
          - Images: ghcr.io/${{ github.repository_owner }}/biogears-external, ghcr.io/${{ github.repository_owner }}/biogears-builder
          - SBOMs: ghcr.io/${{ github.repository_owner }}/biogears-artifacts:sbom-latest
          - Attestations: ghcr.io/${{ github.repository_owner }}/biogears-artifacts:attestations-latest
          - Signatures: ghcr.io/${{ github.repository_owner }}/biogears-artifacts:signatures-latest
          - Policies: ghcr.io/${{ github.repository_owner }}/biogears-artifacts:policies-latest
          
          ## View in GitHub Container Registry
          
          - https://github.com/${{ github.repository_owner }}/packages
          EOF
          
          cat biogears-pipeline-report.md >> $GITHUB_STEP_SUMMARY 